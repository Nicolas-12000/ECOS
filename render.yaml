# Render configuration for ECOS Backend (RAG only)
services:
  - type: web
    name: ecos-backend-rag
    env: python
    region: oregon  # or your preferred region
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    rootDir: .
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: GROQ_API_KEY
        sync: false  # Set this in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: https://ecos-frontend.vercel.app,http://localhost:3000
      # Optional database configuration
      - key: SUPABASE_URL
        sync: false  # Set if using Supabase
      - key: SUPABASE_ANON_KEY
        sync: false  # Set if using Supabase
      - key: DATABASE_URL
        sync: false  # Set if using PostgreSQL directly
      - key: SUPABASE_DB_URL
        sync: false  # Set if using Supabase database
      - key: OPENWEATHER_API_KEY
        sync: false  # Optional for weather data